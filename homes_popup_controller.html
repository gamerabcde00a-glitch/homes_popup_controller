<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>URL Launcher</title>
    <script>
        // Function to get query parameter value
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        window.onload = function () {
            const targetUrl = getQueryParam("URL");
            alert("targetUrl=" + targetUrl);
            alert("gc_conversationId=" + getQueryParam("gc_conversationId"));
            alert("gcLangTag=" + getQueryParam("gcLangTag"));
            alert("gcHostOrigin="+ getQueryParam("gcHostOrigin"));
            alert("gcTargetEnv="+getQueryParam("gcTargetEnv"));
            
            if (targetUrl) {
                alert("targetUrl");
                // Open in a new tab
                window.open(targetUrl,'_blank', 'noopener,noreferrer');
            } else {
                alert("targetUrl else");
                window.open('https://gamerabcde00a-glitch.github.io/mock-crm-lite/console.html?page=home.html', '_blank', 'noopener,noreferrer');
               
            }
        };
    </script>
</head>
<body>
    <h2 id="message">Opening URL...</h2>
</body>
</html>
